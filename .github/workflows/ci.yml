name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'portfolio-web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'netlify.toml'
            service:
              - 'content-service/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/scripts/**'
              - '.github/workflows/deploy.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w portfolio-web
      - run: npm run lint -w portfolio-web
      - run: npm run build -w portfolio-web

  service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check content-service/src/index.mjs
      - run: node --check content-service/src/app.mjs
      - run: node --test content-service/test/service.test.mjs
      - run: shellcheck .github/scripts/*.sh
      - run: docker build -f content-service/Dockerfile -t content-service:ci .
