[build]
  command = "npm run build -w portfolio-web"
  publish = "portfolio-web/dist"
  edge_functions = "portfolio-web/netlify/edge-functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- portfolio-web netlify.toml package-lock.json package.json"

[dev]
  command = "npm run start -w portfolio-web"
  framework = "#custom"
  targetPort = 3000
  port = 8888

# Same-origin proxy to the content service, so the browser reuses the credential
# it already sent to /admin instead of prompting for a second one. Must come
# before the SPA catch-all below.
[[redirects]]
  from = "/api/*"
  to = "https://portfolio.api.radualex.me/api/:splat"
  status = 200
  force = true

# Client-side routing: /contact and /admin are not files on disk, so a direct
# load or a refresh on either has to be answered with index.html. Status 200
# rather than 301 so the URL the visitor typed is the URL they keep.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# /admin is gated by HTTP Basic Auth; the credential is the ADMIN_CREDENTIALS env var (Functions scope).
[[edge_functions]]
  path = "/admin"
  function = "admin-auth"

[[edge_functions]]
  path = "/admin/*"
  function = "admin-auth"
